name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs the build and then the end-to-end suite. The suite needs no Overleaf account:
      # the Overleaf side is a stub client, so push/undo/refresh/delete paths are all
      # exercised against a real git mirror without touching anyone's project.
      - name: Test
        run: npm test